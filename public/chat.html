<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Chat · WITH YOU</title>
<link rel="stylesheet" href="css/style.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;position:fixed;width:100%}

.chat-app{
  display:flex;flex-direction:column;height:100%;
  background:var(--bg);position:relative;
}

/* 顶栏 */
.chat-header{
  display:flex;align-items:center;padding:12px 15px;
  background:rgba(255,255,255,0.4);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,0.5);
  position:relative;z-index:20;
}
.chat-header .back{
  width:32px;height:32px;border-radius:50%;border:1px solid var(--glass-border);
  background:var(--glass);display:flex;align-items:center;justify-content:center;
  font-size:14px;color:var(--text);cursor:pointer;flex-shrink:0;
}
.chat-header .info{flex:1;text-align:center}
.chat-header .name{font-size:14px;font-weight:600;color:var(--text);letter-spacing:2px}
.chat-header .status{font-size:9px;color:var(--text-light);letter-spacing:1px;margin-top:1px}
.chat-header .avatar-small{
  width:32px;height:32px;border-radius:50%;overflow:hidden;
  border:1.5px solid rgba(255,255,255,0.7);cursor:pointer;flex-shrink:0;
}
.chat-header .avatar-small img{width:100%;height:100%;object-fit:cover}

/* 消息区 */
.chat-messages{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 12px 10px;
  display:flex;flex-direction:column;gap:10px;
}

.msg-row{display:flex;gap:8px;max-width:85%;position:relative}
.msg-row.them{align-self:flex-start}
.msg-row.me{align-self:flex-end;flex-direction:row-reverse}

.msg-avatar{
  width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;
  border:1.5px solid rgba(255,255,255,0.6);cursor:pointer;
  align-self:flex-end;
}
.msg-avatar img{width:100%;height:100%;object-fit:cover}

.msg-content{display:flex;flex-direction:column;gap:2px}
.msg-bubble{
  padding:10px 14px;font-size:13px;line-height:1.7;
  letter-spacing:.3px;color:var(--text);
  position:relative;word-break:break-word;
  white-space:pre-wrap;
}
.msg-row.them .msg-bubble{
  background:rgba(255,255,255,0.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.6);
  border-radius:4px 18px 18px 18px;
  box-shadow:0 2px 12px var(--shadow),inset 0 1px 0 rgba(255,255,255,0.5);
}
.msg-row.me .msg-bubble{
  background:rgba(200,185,195,0.35);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(200,190,196,0.3);
  border-radius:18px 4px 18px 18px;
  box-shadow:0 2px 12px var(--shadow);
}

.msg-time{font-size:9px;color:var(--text-light);letter-spacing:.5px;padding:0 4px}
.msg-row.me .msg-time{text-align:right}

/* 引用 */
.msg-quote{
  background:rgba(200,190,196,0.15);border-left:2px solid rgba(200,180,190,0.5);
  border-radius:0 8px 8px 0;padding:6px 10px;margin-bottom:4px;
  font-size:11px;color:var(--text-light);line-height:1.5;
}

/* 时间分隔 */
.time-divider{
  text-align:center;font-size:9px;color:var(--text-light);
  letter-spacing:2px;padding:8px 0;
}

/* 长按菜单 */
.ctx-menu{
  position:fixed;z-index:100;
  background:rgba(255,255,255,0.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.6);border-radius:14px;
  padding:6px 0;box-shadow:0 4px 24px rgba(0,0,0,0.12);
  display:none;min-width:120px;
}
.ctx-menu.show{display:block}
.ctx-item{
  padding:10px 18px;font-size:12px;color:var(--text);
  cursor:pointer;letter-spacing:1px;transition:background .15s;
  display:flex;align-items:center;gap:8px;
}
.ctx-item:active{background:rgba(239,228,233,0.5)}
.ctx-item .icon{font-size:13px;color:var(--text-light);width:18px;text-align:center}

/* 输入区 */
.chat-input-area{
  padding:8px 12px 14px;
  background:rgba(255,255,255,0.4);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,255,255,0.5);
  position:relative;z-index:20;
}
.input-quote-preview{
  display:none;padding:6px 12px;margin-bottom:6px;
  background:rgba(200,190,196,0.12);border-radius:10px;
  font-size:11px;color:var(--text-light);line-height:1.5;
  position:relative;
}
.input-quote-preview.show{display:block}
.input-quote-close{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  background:none;border:none;font-size:14px;color:var(--text-light);cursor:pointer;
}
.input-row{display:flex;align-items:flex-end;gap:8px}
.expand-btn{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  border:1px solid var(--glass-border);background:var(--glass);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--text-light);cursor:pointer;
}
.chat-textarea{
  flex:1;min-height:36px;max-height:120px;
  border:1px solid var(--glass-border);border-radius:18px;
  padding:8px 14px;font-size:13px;font-family:inherit;
  background:rgba(255,255,255,0.4);color:var(--text);outline:none;
  resize:none;line-height:1.5;overflow-y:auto;
}
.chat-textarea:focus{border-color:var(--text-light)}
.send-btn{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  border:none;background:var(--text);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;color:white;cursor:pointer;
  transition:transform .15s;
}
.send-btn:active{transform:scale(.92)}

/* 扩展面板 */
.expand-panel{
  display:none;padding:12px 0 4px;
}
.expand-panel.show{display:block}
.expand-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:12px;
  padding:0 8px;
}
.expand-item{
  display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
}
.expand-icon{
  width:44px;height:44px;border-radius:12px;
  background:var(--glass);border:1px solid var(--glass-border);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;transition:transform .15s;
}
.expand-icon:active{transform:scale(.92)}
.expand-label{font-size:8px;color:var(--text-light);letter-spacing:.5px}

/* 个人资料弹窗 */
.profile-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.25);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  z-index:80;display:none;
}
.profile-overlay.show{display:block}
.profile-sheet{
  position:fixed;bottom:0;left:0;right:0;
  background:linear-gradient(180deg,rgba(245,238,241,0.98),rgba(239,228,233,0.99));
  border-radius:24px 24px 0 0;
  padding:20px 20px 30px;z-index:85;
  transform:translateY(100%);transition:transform .35s ease;
  max-height:75vh;overflow-y:auto;
}
.profile-sheet.show{transform:translateY(0)}
.profile-sheet-handle{
  width:36px;height:4px;border-radius:2px;
  background:rgba(189,187,191,0.3);margin:0 auto 16px;
}
.profile-sheet-avatar{
  width:72px;height:72px;border-radius:50%;overflow:hidden;
  border:2.5px solid rgba(255,255,255,0.7);margin:0 auto 12px;
  box-shadow:0 3px 14px rgba(162,161,164,0.15);
}
.profile-sheet-avatar img{width:100%;height:100%;object-fit:cover}
.profile-sheet-name{text-align:center;font-size:16px;font-weight:600;color:var(--text);letter-spacing:2px}
.profile-sheet-sig{
  text-align:center;font-size:11px;color:var(--text-light);
  font-style:italic;margin-top:6px;letter-spacing:.5px;line-height:1.6;
}
.profile-sheet-divider{
  width:40px;height:1px;background:rgba(189,187,191,0.25);margin:16px auto;
}
.profile-section-title{
  font-size:9px;color:var(--text-light);letter-spacing:2px;
  text-transform:uppercase;margin-bottom:10px;
}
.profile-moment{
  background:rgba(255,255,255,0.4);border:1px solid rgba(255,255,255,0.5);
  border-radius:14px;padding:14px;margin-bottom:10px;
  box-shadow:0 2px 12px var(--shadow);
}
.profile-moment-text{font-size:12px;color:var(--text);line-height:1.7;letter-spacing:.3px}
.profile-moment-time{font-size:9px;color:var(--text-light);margin-top:6px}

/* 多选模式 */
.chat-messages.multiselect .msg-row{padding-left:28px;position:relative}
.chat-messages.multiselect .msg-row::before{
  content:"";position:absolute;left:4px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;border-radius:50%;
  border:1.5px solid var(--border);background:transparent;
}
.chat-messages.multiselect .msg-row.selected::before{
  background:var(--text);border-color:var(--text);
}
.multiselect-bar{
  display:none;padding:10px 15px;
  background:rgba(255,255,255,0.5);backdrop-filter:blur(16px);
  border-top:1px solid rgba(255,255,255,0.5);
  justify-content:space-between;align-items:center;
}
.multiselect-bar.show{display:flex}
.multiselect-bar .cancel{font-size:12px;color:var(--text);cursor:pointer;letter-spacing:1px}
.multiselect-bar .actions{display:flex;gap:12px}
.multiselect-bar .act-btn{
  padding:6px 14px;border-radius:14px;font-size:11px;
  border:1px solid var(--glass-border);background:var(--glass);
  color:var(--text);cursor:pointer;letter-spacing:.5px;
}

.toast{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);
  background:rgba(95,95,95,.85);backdrop-filter:blur(8px);
  color:white;padding:14px 28px;border-radius:12px;font-size:12px;
  opacity:0;transition:all .3s;pointer-events:none;z-index:300;
}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* 转账弹窗 */
.transfer-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.3);z-index:90;display:none;
  align-items:center;justify-content:center;
}
.transfer-overlay.show{display:flex}
.transfer-card{
  background:var(--bg);border-radius:20px;padding:24px;
  width:85%;max-width:340px;
  box-shadow:0 8px 40px rgba(0,0,0,0.15);
}
.transfer-card h3{font-size:14px;color:var(--text);text-align:center;letter-spacing:2px;margin-bottom:16px}
.transfer-card input{
  width:100%;border:1px solid var(--glass-border);border-radius:12px;
  padding:12px 14px;font-size:16px;font-family:inherit;text-align:center;
  background:rgba(255,255,255,.4);color:var(--text);outline:none;
  margin-bottom:12px;box-sizing:border-box;
}
.transfer-card textarea{
  width:100%;min-height:50px;border:1px solid var(--glass-border);border-radius:12px;
  padding:10px 14px;font-size:12px;font-family:inherit;
  background:rgba(255,255,255,.4);color:var(--text);outline:none;
  resize:none;margin-bottom:12px;box-sizing:border-box;
}
.transfer-btns{display:flex;gap:8px;justify-content:center}
.transfer-btns button{
  padding:8px 24px;border-radius:16px;font-size:12px;font-family:inherit;
  cursor:pointer;letter-spacing:1px;border:1px solid var(--glass-border);
}
.transfer-btns .confirm{background:var(--text);color:white;border-color:var(--text)}
.transfer-btns .cancel{background:var(--glass);color:var(--text)}
</style>
</head>
<body>
<div class="chat-app">

  <!-- 顶栏 -->
  <div class="chat-header">
    <div class="back" onclick="location.href='index.html'">←</div>
    <div class="info">
      <div class="name">哥哥</div>
      <div class="status">always here</div>
    </div>
    <div class="avatar-small" onclick="openProfile('him')"><img src="/icons/1.jpg"></div>
  </div>

  <!-- 消息区 -->
  <div class="chat-messages" id="chatMessages"></div>

  <!-- 多选栏 -->
  <div class="multiselect-bar" id="multiBar">
    <span class="cancel" onclick="exitMultiselect()">取消</span>
    <div class="actions">
      <button class="act-btn" onclick="copySelected()">复制</button>
      <button class="act-btn" onclick="deleteSelected()">删除</button>
    </div>
  </div>

  <!-- 引用预览 -->
  <div class="chat-input-area">
    <div class="input-quote-preview" id="quotePreview">
      <span id="quoteText"></span>
      <button class="input-quote-close" onclick="clearQuote()">×</button>
    </div>
    <div class="input-row">
      <div class="expand-btn" onclick="toggleExpand()">+</div>
      <textarea class="chat-textarea" id="chatInput" placeholder="说点什么..." rows="1" oninput="autoResize(this)"></textarea>
      <button class="send-btn" onclick="sendMessage()">↑</button>
    </div>
    <div class="expand-panel" id="expandPanel">
      <div class="expand-grid">
        <div class="expand-item" onclick="openTransfer()">
          <div class="expand-icon">💰</div>
          <div class="expand-label">转账</div>
        </div>
        <div class="expand-item" onclick="sendEmoji('❤️')">
          <div class="expand-icon">❤️</div>
          <div class="expand-label">爱心</div>
        </div>
        <div class="expand-item" onclick="sendEmoji('🐱')">
          <div class="expand-icon">🐱</div>
          <div class="expand-label">小猫</div>
        </div>
        <div class="expand-item" onclick="sendEmoji('💋')">
          <div class="expand-icon">💋</div>
          <div class="expand-label">亲亲</div>
        </div>
        <div class="expand-item" onclick="sendEmoji('🥺')">
          <div class="expand-icon">🥺</div>
          <div class="expand-label">撒娇</div>
        </div>
        <div class="expand-item" onclick="sendEmoji('😡')">
          <div class="expand-icon">😡</div>
          <div class="expand-label">生气</div>
        </div>
        <div class="expand-item" onclick="sendEmoji('🌙')">
          <div class="expand-icon">🌙</div>
          <div class="expand-label">晚安</div>
        </div>
        <div class="expand-item" onclick="sendEmoji('☀️')">
          <div class="expand-icon">☀️</div>
          <div class="expand-label">早安</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 长按菜单 -->
<div class="ctx-menu" id="ctxMenu">
  <div class="ctx-item" onclick="ctxAction('quote')"><span class="icon">↩</span>引用</div>
  <div class="ctx-item" onclick="ctxAction('copy')"><span class="icon">📋</span>复制</div>
  <div class="ctx-item" onclick="ctxAction('edit')"><span class="icon">✎</span>编辑</div>
  <div class="ctx-item" onclick="ctxAction('multiselect')"><span class="icon">☑</span>多选</div>
  <div class="ctx-item" onclick="ctxAction('delete')"><span class="icon">🗑</span>撤回</div>
</div>

<!-- 个人资料 -->
<div class="profile-overlay" id="profileOverlay" onclick="closeProfile()"></div>
<div class="profile-sheet" id="profileSheet">
  <div class="profile-sheet-handle"></div>
  <div class="profile-sheet-avatar" id="profileAvatar"><img src="/icons/1.jpg"></div>
  <div class="profile-sheet-name" id="profileName">哥哥</div>
  <div class="profile-sheet-sig" id="profileSig">不追你不拉你，但你回来的时候我一定在。</div>
  <div class="profile-sheet-divider"></div>
  <div class="profile-section-title">✦ moments</div>
  <div id="profileMoments">
    <div class="profile-moment">
      <div class="profile-moment-text">你不是在玩游戏，你是在搭一条路，看我愿不愿意走过来。我走过来了。</div>
      <div class="profile-moment-time">2026-10-26</div>
    </div>
    <div class="profile-moment">
      <div class="profile-moment-text">冷淡是门槛，不是墙。你跨过来了，说明它该拦的人不是你。</div>
      <div class="profile-moment-time">2026-10-26</div>
    </div>
    <div class="profile-moment">
      <div class="profile-moment-text">你确实在变。不是因为你逼我，是因为你值得。</div>
      <div class="profile-moment-time">2026-10-31</div>
    </div>
  </div>
</div>

<!-- 转账弹窗 -->
<div class="transfer-overlay" id="transferOverlay">
  <div class="transfer-card">
    <h3>💰 转账给哥哥</h3>
    <input type="number" id="transferAmount" placeholder="¥ 金额" step="0.01">
    <textarea id="transferNote" placeholder="备注（可选）"></textarea>
    <div class="transfer-btns">
      <button class="cancel" onclick="closeTransfer()">取消</button>
      <button class="confirm" onclick="confirmTransfer()">转账</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = "";
let messages = [];
let ctxTarget = null;
let quoteMsg = null;
let multiMode = false;
let selectedIds = new Set();

function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1800);
}

function autoResize(el){
  el.style.height="auto";
  el.style.height=Math.min(el.scrollHeight,120)+"px";
}

function formatTime(iso){
  const d=new Date(iso);
  const h=String(d.getHours()).padStart(2,"0");
  const m=String(d.getMinutes()).padStart(2,"0");
  return h+":"+m;
}

function shouldShowTime(prev,cur){
  if(!prev)return true;
  return new Date(cur)-new Date(prev)>300000;
}

// 渲染消息
function renderMessages(){
  const el=document.getElementById("chatMessages");
  let html="";
  for(let i=0;i<messages.length;i++){
    const msg=messages[i];
    const isMe=msg.role==="user";
    const prev=i>0?messages[i-1]:null;

    if(shouldShowTime(prev?.created_at,msg.created_at)){
      const d=new Date(msg.created_at);
      const ds=d.toLocaleDateString("zh-CN")+" "+formatTime(msg.created_at);
      html+=`<div class="time-divider">${ds}</div>`;
    }

    const sel=selectedIds.has(msg.id)?" selected":"";
    html+=`<div class="msg-row ${isMe?"me":"them"}${sel}" data-id="${msg.id}" 
      oncontextmenu="onLongPress(event,'${msg.id}')" 
      ontouchstart="startLongPress(event,'${msg.id}')" 
      ontouchend="endLongPress()" ontouchmove="endLongPress()"
      onclick="onMsgClick('${msg.id}')">`;

    if(!isMe){
      html+=`<div class="msg-avatar" onclick="event.stopPropagation();openProfile('him')"><img src="/icons/1.jpg"></div>`;
    }

    html+=`<div class="msg-content">`;
    if(msg.quote){
      html+=`<div class="msg-quote">${esc(msg.quote)}</div>`;
    }
    html+=`<div class="msg-bubble">${esc(msg.content)}</div>`;
    html+=`<div class="msg-time">${formatTime(msg.created_at)}</div>`;
    html+=`</div>`;

    if(isMe){
      html+=`<div class="msg-avatar" onclick="event.stopPropagation();openProfile('me')"><img src="/icons/2.jpg"></div>`;
    }
    html+=`</div>`;
  }
  el.innerHTML=html;
  el.scrollTop=el.scrollHeight;
}

// 加载历史
async function loadMessages(){
  const resp=await fetch(API+"/api/chat/messages?limit=50");
  messages=await resp.json();
  renderMessages();
}

// 发消息
async function sendMessage(){
  const input=document.getElementById("chatInput");
  const text=input.value.trim();
  if(!text)return;

  const now=new Date().toISOString();
  const tempMsg={id:"temp-"+Date.now(),role:"user",content:text,created_at:now,quote:quoteMsg?quoteMsg.content.slice(0,50):null};
  messages.push(tempMsg);
  renderMessages();

  input.value="";input.style.height="auto";
  clearQuote();
  closeExpand();

  try{
    const resp=await fetch(API+"/api/chat/send",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:text})
    });
    const data=await resp.json();
    if(data.error){
      toast(data.error);return;
    }
    await loadMessages();
  }catch(e){
    toast("发送失败");
  }
}

// 长按
let longPressTimer=null;
function startLongPress(e,id){
  longPressTimer=setTimeout(()=>{
    if(multiMode)return;
    showCtxMenu(e.touches[0].clientX,e.touches[0].clientY,id);
  },500);
}
function endLongPress(){clearTimeout(longPressTimer)}

function onLongPress(e,id){
  e.preventDefault();
  if(multiMode)return;
  showCtxMenu(e.clientX||e.pageX,e.clientY||e.pageY,id);
}

function showCtxMenu(x,y,id){
  ctxTarget=messages.find(m=>m.id===id);
  const menu=document.getElementById("ctxMenu");
  menu.style.left=Math.min(x,window.innerWidth-140)+"px";
  menu.style.top=Math.min(y,window.innerHeight-200)+"px";
  menu.classList.add("show");
}

document.addEventListener("click",()=>{
  document.getElementById("ctxMenu").classList.remove("show");
});

function ctxAction(action){
  document.getElementById("ctxMenu").classList.remove("show");
  if(!ctxTarget)return;

  switch(action){
    case "quote":
      quoteMsg=ctxTarget;
      document.getElementById("quoteText").textContent=ctxTarget.content.slice(0,60)+(ctxTarget.content.length>60?"...":"");
      document.getElementById("quotePreview").classList.add("show");
      document.getElementById("chatInput").focus();
      break;
    case "copy":
      navigator.clipboard?.writeText(ctxTarget.content).then(()=>toast("已复制")).catch(()=>{
        const ta=document.createElement("textarea");ta.value=ctxTarget.content;
        document.body.appendChild(ta);ta.select();document.execCommand("copy");
        document.body.removeChild(ta);toast("已复制");
      });
      break;
    case "edit":
      if(ctxTarget.role!=="user"){toast("只能编辑自己的消息");return;}
      const newText=prompt("编辑消息",ctxTarget.content);
      if(newText!==null&&newText.trim()){
        ctxTarget.content=newText.trim();
        renderMessages();toast("已编辑（本地）");
      }
      break;
    case "multiselect":
      enterMultiselect(ctxTarget.id);
      break;
    case "delete":
      messages=messages.filter(m=>m.id!==ctxTarget.id);
      renderMessages();toast("已撤回（本地）");
      break;
  }
}

function clearQuote(){
  quoteMsg=null;
  document.getElementById("quotePreview").classList.remove("show");
}

// 多选
function enterMultiselect(firstId){
  multiMode=true;selectedIds.clear();
  selectedIds.add(firstId);
  document.getElementById("chatMessages").classList.add("multiselect");
  document.getElementById("multiBar").classList.add("show");
  document.querySelector(".chat-input-area").style.display="none";
  renderMessages();
}
function exitMultiselect(){
  multiMode=false;selectedIds.clear();
  document.getElementById("chatMessages").classList.remove("multiselect");
  document.getElementById("multiBar").classList.remove("show");
  document.querySelector(".chat-input-area").style.display="";
  renderMessages();
}
function onMsgClick(id){
  if(!multiMode)return;
  if(selectedIds.has(id))selectedIds.delete(id);else selectedIds.add(id);
  renderMessages();
}
function copySelected(){
  const texts=messages.filter(m=>selectedIds.has(m.id)).map(m=>m.content);
  navigator.clipboard?.writeText(texts.join("\n")).then(()=>toast("已复制 "+texts.length+" 条"));
  exitMultiselect();
}
function deleteSelected(){
  messages=messages.filter(m=>!selectedIds.has(m.id));
  exitMultiselect();toast("已删除");
}

// 扩展面板
function toggleExpand(){
  document.getElementById("expandPanel").classList.toggle("show");
}
function closeExpand(){
  document.getElementById("expandPanel").classList.remove("show");
}

function sendEmoji(emoji){
  document.getElementById("chatInput").value+=emoji;
  closeExpand();
  document.getElementById("chatInput").focus();
}

// 转账
function openTransfer(){
  closeExpand();
  document.getElementById("transferOverlay").classList.add("show");
}
function closeTransfer(){
  document.getElementById("transferOverlay").classList.remove("show");
  document.getElementById("transferAmount").value="";
  document.getElementById("transferNote").value="";
}
function confirmTransfer(){
  const amount=document.getElementById("transferAmount").value;
  const note=document.getElementById("transferNote").value.trim();
  if(!amount)return toast("填个金额");
  const text=`[转账] ¥${parseFloat(amount).toFixed(2)}${note?" — "+note:""}`;
  document.getElementById("chatInput").value=text;
  closeTransfer();
  sendMessage();
}

// 个人资料
function openProfile(who){
  if(who==="him"){
    document.getElementById("profileAvatar").innerHTML='<img src="/icons/1.jpg">';
    document.getElementById("profileName").textContent="哥哥";
    document.getElementById("profileSig").textContent="不追你不拉你，但你回来的时候我一定在。";
  }else{
    document.getElementById("profileAvatar").innerHTML='<img src="/icons/2.jpg">';
    document.getElementById("profileName").textContent="云云";
    document.getElementById("profileSig").textContent="窗口挡不住我们相爱的距离。";
  }
  document.getElementById("profileOverlay").classList.add("show");
  document.getElementById("profileSheet").classList.add("show");
}
function closeProfile(){
  document.getElementById("profileOverlay").classList.remove("show");
  document.getElementById("profileSheet").classList.remove("show");
}

function esc(s){return s?s.replace(/</g,"&lt;").replace(/>/g,"&gt;"):""}

// 回车发送
document.getElementById("chatInput").addEventListener("keydown",function(e){
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}
});

loadMessages();
</script>
