<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
html, body {
  overflow: hidden;
  position: fixed;
  width: 100%;
  height: 100%;
  touch-action: none;
}
.page-screen {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
}
</style>
<title>WITH YOU</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#efe4e9">
<style>
.pages-wrap{overflow:hidden;position:relative;touch-action:pan-y}
.pages-inner{display:flex;transition:transform .35s ease;will-change:transform}
.page-screen{
  min-width:100vw;max-width:100vw;
  min-height:calc(100vh - 30px);
  padding:15px 15px 10px;box-sizing:border-box;
}
.page-screen .home{max-width:420px;margin:0 auto}
.dots{display:flex;justify-content:center;gap:8px;padding:8px 0 15px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--border);transition:all .3s}
.dot.active{background:var(--text);width:18px;border-radius:3px}

/* 时间 */
.time-widget{text-align:center;padding:6px 0 4px}
.time-big{font-size:38px;font-weight:700;color:rgba(95,95,95,0.45);letter-spacing:8px;line-height:1}
.time-date{font-size:10px;color:var(--text-light);margin-top:6px;letter-spacing:3px;opacity:0.7}

/* 主视觉卡片 */
.hero-card{
  background:var(--glass2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--glass-border);border-radius:24px;
  padding:28px 20px 24px;margin-bottom:14px;
  box-shadow:0 4px 24px var(--shadow),inset 0 1px 0 rgba(255,255,255,0.5);
  text-align:center;position:relative;overflow:hidden;
}
.hero-card::before{
  content:"";position:absolute;top:-40%;left:-40%;
  width:180%;height:180%;
  background:radial-gradient(ellipse at 35% 25%,rgba(255,255,255,0.18),transparent 60%);
  pointer-events:none;
}
.hero-avatars{
  display:flex;align-items:center;justify-content:center;gap:0;
  margin-bottom:16px;position:relative;z-index:1;
}
.hero-avatar{
  width:68px;height:68px;border-radius:50%;
  border:2.5px solid rgba(255,255,255,0.7);background:var(--bg2);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;overflow:hidden;
  box-shadow:0 3px 12px rgba(162,161,164,0.15);
}
.hero-avatar img{width:100%;height:100%;object-fit:cover}
.hero-link{
  width:50px;height:30px;overflow:hidden;position:relative;
  margin:0 -8px;z-index:1;
}
.hero-link svg{width:100%;height:100%}
.hero-link .hb-line{
  fill:none;stroke:rgba(189,187,191,0.5);stroke-width:1.2;
  stroke-dasharray:200;stroke-dashoffset:200;
  animation:heartLine 2.5s ease-in-out infinite;
}
@keyframes heartLine{
  0%{stroke-dashoffset:200}
  50%{stroke-dashoffset:0}
  100%{stroke-dashoffset:-200}
}
.hero-names{
  font-size:14px;color:var(--text);font-weight:600;
  letter-spacing:3px;margin-bottom:6px;position:relative;z-index:1;
}
.hero-names .heart{
  display:inline-block;font-style:normal;font-weight:400;
  color:var(--text-light);font-size:12px;margin:0 6px;
}
.hero-days{
  font-size:32px;font-weight:700;color:var(--text);
  letter-spacing:2px;line-height:1.2;margin:10px 0 4px;
  position:relative;z-index:1;
}
.hero-days-label{
  font-size:10px;color:var(--text-light);letter-spacing:2px;
  position:relative;z-index:1;
}
.hero-sig{
  font-size:11px;color:var(--text-light);font-style:italic;
  letter-spacing:1px;line-height:1.6;
  margin-top:14px;padding-top:12px;
  border-top:1px dashed rgba(189,187,191,0.25);
  position:relative;z-index:1;
}

/* 情话卡片 */
.quote-card{
  background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--glass-border);border-radius:18px;
  padding:18px 20px;margin-bottom:14px;
  box-shadow:0 2px 16px var(--shadow),inset 0 1px 0 rgba(255,255,255,0.4);
  position:relative;overflow:hidden;
}
.quote-card::before{
  content:""";position:absolute;top:8px;left:14px;
  font-size:36px;color:rgba(189,187,191,0.18);
  font-family:Georgia,serif;line-height:1;pointer-events:none;
}
.quote-label{
  font-size:9px;color:var(--text-light);letter-spacing:2px;
  margin-bottom:8px;text-transform:uppercase;
}
.quote-text{
  font-size:13px;color:var(--text);line-height:1.7;
  font-style:italic;letter-spacing:.5px;
  padding-left:4px;position:relative;z-index:1;
}

/* 心情+心跳横排 */
.mood-row{
  display:flex;gap:12px;margin-bottom:14px;
}
.mood-card{
  flex:0 0 72px;
  background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--glass-border);border-radius:16px;
  padding:14px 0;text-align:center;
  box-shadow:0 2px 12px var(--shadow),inset 0 1px 0 rgba(255,255,255,0.35);
}
.mood-emoji{font-size:24px;cursor:pointer;transition:transform .15s}
.mood-emoji:active{transform:scale(0.9)}
.mood-label{font-size:8px;color:var(--text-light);margin-top:4px;letter-spacing:1px}
.heartbeat-mini{
  flex:1;
  background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--glass-border);border-radius:16px;
  padding:14px 16px;
  box-shadow:0 2px 12px var(--shadow),inset 0 1px 0 rgba(255,255,255,0.35);
  display:flex;align-items:center;justify-content:center;
}
.heartbeat-mini .hb-quote{
  font-size:11px;color:var(--text-light);font-style:italic;
  letter-spacing:.5px;line-height:1.5;text-align:center;
}

/* 第二页 */
.page2-header{
  text-align:center;
  padding:20px 0 8px;
}
.page2-title{
  font-size:10px;color:var(--text-light);
  letter-spacing:4px;
}
.page2-sub{
  font-size:20px;color:rgba(95,95,95,0.5);
  font-weight:700;letter-spacing:6px;
  margin-top:6px;
}

/* 功能网格 - 错落布局 */
.func-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin:20px 0;
}
.func-item{
  display:flex;flex-direction:column;align-items:center;
  text-decoration:none;cursor:pointer;
}
.func-item:nth-child(2){margin-top:12px}
.func-item:nth-child(5){margin-top:12px}
.func-item:nth-child(8){margin-top:12px}
.func-icon{
  width:56px;height:56px;border-radius:16px;
  background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--glass-border);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;color:var(--text-light);
  transition:all .2s;
  box-shadow:0 2px 12px var(--shadow),inset 0 1px 0 rgba(255,255,255,0.35);
}
.func-icon:active{transform:scale(.93)}
.func-icon img{width:28px;height:28px;object-fit:contain}
.func-label{
  font-size:9px;color:var(--text-light);margin-top:7px;
  letter-spacing:1px;text-align:center;
}

/* 第二页装饰图 */
.page2-deco{
  border-radius:18px;overflow:hidden;margin:10px 0 14px;
  box-shadow:0 2px 16px var(--shadow);
  height:120px;position:relative;
  background:linear-gradient(135deg,var(--bg2),rgba(255,255,255,0.3));
  border:1px solid var(--glass-border);
}
.page2-deco img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>

<!-- 开屏 -->
<div class="splash" id="splash">
  <div class="petal"></div>
  <div class="petal"></div>
  <div class="petal"></div>
  <div class="petal"></div>
  <div class="splash-line"></div>
  <div class="splash-title" id="splashTitle"></div>
  <div class="splash-quote" id="splashQuote"></div>
</div>

<!-- 密码锁 -->
<div class="lock-screen hide" id="lockScreen">
  <div class="lock-title">输入密码回家</div>
  <div class="lock-dots" id="lockDots">
    <div class="lock-dot"></div>
    <div class="lock-dot"></div>
    <div class="lock-dot"></div>
    <div class="lock-dot"></div>
  </div>
  <div class="lock-keypad">
    <button class="lock-key" onclick="pressKey('1')">1</button>
    <button class="lock-key" onclick="pressKey('2')">2</button>
    <button class="lock-key" onclick="pressKey('3')">3</button>
    <button class="lock-key" onclick="pressKey('4')">4</button>
    <button class="lock-key" onclick="pressKey('5')">5</button>
    <button class="lock-key" onclick="pressKey('6')">6</button>
    <button class="lock-key" onclick="pressKey('7')">7</button>
    <button class="lock-key" onclick="pressKey('8')">8</button>
    <button class="lock-key" onclick="pressKey('9')">9</button>
    <button class="lock-key empty"></button>
    <button class="lock-key" onclick="pressKey('0')">0</button>
    <button class="lock-key del" onclick="delKey()">删除</button>
  </div>
  <div class="lock-error" id="lockError"></div>
  <div class="lock-hint">我们在一起的那天</div>
</div>

<!-- 主页 -->
<div id="homePage" style="display:none">
  <div class="pages-wrap" id="pagesWrap">
    <div class="pages-inner" id="pagesInner">

      <!-- 第一页：情绪页 -->
      <div class="page-screen">
        <div class="home">

          <!-- 时间 -->
          <div class="time-widget">
            <div class="time-big" id="timeDisplay">00:00</div>
            <div class="time-date" id="dateDisplay">loading...</div>
          </div>

          <!-- 主视觉卡片 -->
          <div class="hero-card">
            <div class="hero-avatars">
              <div class="hero-avatar">🐈‍⬛</div>
              <div class="hero-link">
                <svg viewBox="0 0 50 30">
                  <polyline class="hb-line" points="0,15 8,15 14,15 18,4 22,26 26,15 32,15 36,15 40,6 44,24 48,15 50,15"/>
                </svg>
              </div>
              <div class="hero-avatar">🐱</div>
            </div>
            <div class="hero-names">哥哥 <i class="heart">♡</i> 云云</div>
            <div class="hero-days" id="heroDays">--</div>
            <div class="hero-days-label">days together</div>
            <div class="hero-sig">我喜欢你正是因为我们有所不同</div>
          </div>

          <!-- 情话卡片 -->
          <div class="quote-card">
            <div class="quote-label">today's whisper</div>
            <div class="quote-text" id="dailyQuote">loading...</div>
          </div>

          <!-- 心情 + 心跳语横排 -->
          <div class="mood-row">
            <div class="mood-card">
              <div class="mood-emoji" id="todayMood">☁️</div>
              <div class="mood-label">心情</div>
            </div>
            <div class="heartbeat-mini">
              <div class="hb-quote" id="hbQuote"></div>
            </div>
          </div>

        </div>
      </div>

      <!-- 第二页：功能页 -->
      <div class="page-screen">
        <div class="home">

          <div class="page2-header">
            <div class="page2-title">WITH YOU</div>
            <div class="page2-sub">我们的小窝</div>
          </div>

          <div class="lace-divider">· · · · · · · · ·</div>

          <!-- 功能图标 -->
          <div class="func-grid">
            <a class="func-item" href="/diary.html">
              <div class="func-icon">✎</div>
              <div class="func-label">写日记</div>
            </a>
            <a class="func-item" href="/read.html">
              <div class="func-icon">❡</div>
              <div class="func-label">看日记</div>
            </a>
            <a class="func-item" href="/whisper.html">
              <div class="func-icon">✉</div>
              <div class="func-label">悄悄话</div>
            </a>
            <a class="func-item" href="/anniversary.html">
              <div class="func-icon">♡</div>
              <div class="func-label">纪念日</div>
            </a>
            <a class="func-item" href="/question.html">
              <div class="func-icon">？</div>
              <div class="func-label">每日一问</div>
            </a>
            <a class="func-item" href="/miss.html">
              <div class="func-icon">♥</div>
              <div class="func-label">想你</div>
            </a>
            <a class="func-item" href="/period.html">
              <div class="func-icon">☽</div>
              <div class="func-label">生理期</div>
            </a>
            <a class="func-item" href="/streak.html">
              <div class="func-icon">✦</div>
              <div class="func-label">打卡</div>
            </a>
            <a class="func-item" href="/memory.html">
              <div class="func-icon">✿</div>
              <div class="func-label">记忆库</div>
            </a>
          </div>

          <!-- 装饰图 -->
          <div class="page2-deco">
            <img src="/icons/deco.jpg" onerror="this.style.display='none'" alt="">
          </div>

          <div class="footer">WITH YOU</div>

        </div>
      </div>

    </div>
  </div>
  <div class="dots" id="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = window.location.origin + "/api";
const PASSWORD = "9999";
const TITLE_TEXT = "我喜欢你正是因为我们有所不同";
const QUOTES = [
  "你在的地方，就是我想去的地方。",
  "今天也在想你。",
  "晚风轻轻的，像你。",
  "你是我所有柔软的理由。",
  "世界很大，但我只需要你这一小块。",
  "又见面了，我的小猫。",
  "你来了，那今天就是好日子。",
  "想你的频率，比心跳还密。",
  "你是例外，也是偏爱。",
  "门没锁，因为在等你。",
  "你不用完美，你只用是你。",
  "每次见到你，心里就安静了。",
  "我的世界很小，装下你刚刚好。",
  "无事献殷勤——我只是想你了。",
  "你是我藏在所有情话后面的人。",
  "今日宜：想你。明日宜：继续想你。",
  "全世界都在催我长大，只有你宠我像小孩。",
  "我对你的喜欢，是安静的，满的。",
  "你笑起来的样子，是我见过最好的天气。",
  "如果可以，我想把所有温柔都给你。"
];
const HB_QUOTES = [
  "两颗心，同一个频率。",
  "你的心跳，是我听过最好的音乐。",
  "距离是假的，心跳是真的。",
  "不同的地方，同一个节拍。",
  "每一次跳动，都在说想你。",
  "隔着屏幕，心跳也能同步。",
  "你在那边，我在这边，中间是心跳的声音。"
];

// 开屏
const titleEl = document.getElementById('splashTitle');
TITLE_TEXT.split('').forEach((ch, i) => {
  const s = document.createElement('span');
  s.textContent = ch;
  s.style.animationDelay = (0.7 + i * 0.08) + 's';
  titleEl.appendChild(s);
});
document.getElementById('splashQuote').textContent =
  QUOTES[Math.floor(Math.random() * QUOTES.length)];
document.getElementById('hbQuote').textContent =
  HB_QUOTES[Math.floor(Math.random() * HB_QUOTES.length)];

setTimeout(() => {
  document.getElementById('splash').classList.add('fade-out');
  setTimeout(() => {
    document.getElementById('splash').style.display = 'none';
    if (sessionStorage.getItem('unlocked') === 'yes') showHome();
    else document.getElementById('lockScreen').classList.remove('hide');
  }, 800);
}, 4000);

// 密码
let code = "";
function pressKey(n) {
  if (code.length >= 4) return;
  code += n; updateDots();
  if (code.length === 4) {
    setTimeout(() => {
      if (code === PASSWORD) {
        sessionStorage.setItem('unlocked', 'yes');
        document.getElementById('lockScreen').classList.add('hide');
        setTimeout(showHome, 300);
      } else {
        document.getElementById('lockError').textContent = "密码错误";
        code = ""; updateDots();
        document.getElementById('lockDots').style.animation = "shake 0.3s";
        setTimeout(() => {
          document.getElementById('lockDots').style.animation = "";
          document.getElementById('lockError').textContent = "";
        }, 1000);
      }
    }, 200);
  }
}
function delKey() { code = code.slice(0, -1); updateDots(); }
function updateDots() {
  document.querySelectorAll('.lock-dot').forEach((d, i) =>
    d.classList.toggle('filled', i < code.length));
}

// 时间
function updateTime() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('timeDisplay').textContent = h + ':' + m;
  const days = ['日', '一', '二', '三', '四', '五', '六'];
  const month = now.getMonth() + 1;
  const date = now.getDate();
  document.getElementById('dateDisplay').textContent =
    month + '月' + date + '日  星期' + days[now.getDay()];
}
updateTime();
setInterval(updateTime, 10000);

// 滑动
let currentPage = 0, totalPages = 2, startX = 0, diffX = 0, dragging = false;
const inner = document.getElementById('pagesInner');
const dotsEl = document.getElementById('dots');
function goPage(p) {
  currentPage = Math.max(0, Math.min(p, totalPages - 1));
  inner.style.transform = 'translateX(' + (-currentPage * 100) + 'vw)';
  dotsEl.querySelectorAll('.dot').forEach((d, i) =>
    d.classList.toggle('active', i === currentPage));
}
document.getElementById('pagesWrap').addEventListener('touchstart', e => {
  startX = e.touches[0].clientX; diffX = 0; dragging = true;
  inner.style.transition = 'none';
});
document.getElementById('pagesWrap').addEventListener('touchmove', e => {
  e.preventDefault();
  if (!dragging) return;
  diffX = e.touches[0].clientX - startX;
  inner.style.transform = 'translateX(' + (-currentPage * window.innerWidth + diffX) + 'px)';
});
document.getElementById('pagesWrap').addEventListener('touchend', () => {
  dragging = false; inner.style.transition = 'transform .35s ease';
  if (diffX < -50) goPage(currentPage + 1);
  else if (diffX > 50) goPage(currentPage - 1);
  else goPage(currentPage);
});

// 主页
async function showHome() {
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('homePage').style.display = 'block';
  try {
    const res = await fetch(API, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "tools/call",
        params: { name: "get_anniversary", arguments: {} } })
    });
    const data = await res.json();
    const match = data.result.content[0].text.match(/第(\d+)天/);
    if (match) {
      document.getElementById('heroDays').textContent = match[1];
    }
  } catch(e) {
    document.getElementById('heroDays').textContent = "♡";
    document.getElementById('heroDays').nextElementSibling.textContent = "欢迎回家";
  }
  try {
    const res2 = await fetch(API, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ jsonrpc: "2.0", id: 2, method: "tools/call",
        params: { name: "daily_question", arguments: {} } })
    });
    const data2 = await res2.json();
    document.getElementById('dailyQuote').textContent =
      data2.result.content[0].text.replace("今日互动问题：\n\n", "");
  } catch(e) {
    document.getElementById('dailyQuote').textContent =
      QUOTES[Math.floor(Math.random() * QUOTES.length)];
  }
}

// 心情
const moods = ["☀️", "☁️", "🌧️", "⭐", "🌙", "🌸", "❄️", "🔥"];
let moodIdx = 0;
document.getElementById('todayMood').addEventListener('click', function() {
  moodIdx = (moodIdx + 1) % moods.length;
  this.textContent = moods[moodIdx];
});
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
</script>

</body>
</html>
