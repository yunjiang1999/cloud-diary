<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WITH YOU</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#efe4e9">
<style>
.pages-wrap{
  overflow:hidden;position:relative;
  touch-action:pan-y;
}
.pages-inner{
  display:flex;transition:transform .35s ease;
  will-change:transform;
}
.page-screen{
  min-width:100vw;max-width:100vw;
  min-height:calc(100vh - 30px);
  padding:20px 15px 10px;
  box-sizing:border-box;
}
.page-screen .home{max-width:420px;margin:0 auto}
.dots{
  display:flex;justify-content:center;gap:8px;
  padding:10px 0 20px;
}
.dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--border);transition:all .3s;
}
.dot.active{background:var(--text);width:18px;border-radius:3px}
</style>
</head>
<body>

<!-- 开屏 -->
<div class="splash" id="splash">
  <div class="petal"></div>
  <div class="petal"></div>
  <div class="petal"></div>
  <div class="petal"></div>
  <div class="splash-line"></div>
  <div class="splash-title" id="splashTitle"></div>
  <div class="splash-quote" id="splashQuote"></div>
</div>

<!-- 密码锁 -->
<div class="lock-screen hide" id="lockScreen">
  <div class="lock-title">输入密码回家</div>
  <div class="lock-dots" id="lockDots">
    <div class="lock-dot"></div>
    <div class="lock-dot"></div>
    <div class="lock-dot"></div>
    <div class="lock-dot"></div>
  </div>
  <div class="lock-keypad">
    <button class="lock-key" onclick="pressKey('1')">1</button>
    <button class="lock-key" onclick="pressKey('2')">2</button>
    <button class="lock-key" onclick="pressKey('3')">3</button>
    <button class="lock-key" onclick="pressKey('4')">4</button>
    <button class="lock-key" onclick="pressKey('5')">5</button>
    <button class="lock-key" onclick="pressKey('6')">6</button>
    <button class="lock-key" onclick="pressKey('7')">7</button>
    <button class="lock-key" onclick="pressKey('8')">8</button>
    <button class="lock-key" onclick="pressKey('9')">9</button>
    <button class="lock-key empty"></button>
    <button class="lock-key" onclick="pressKey('0')">0</button>
    <button class="lock-key del" onclick="delKey()">删除</button>
  </div>
  <div class="lock-error" id="lockError"></div>
  <div class="lock-hint">我们在一起的那天</div>
</div>

<!-- 主页 -->
<div id="homePage" style="display:none">
  <div class="pages-wrap" id="pagesWrap">
    <div class="pages-inner" id="pagesInner">

      <!-- 第一页 -->
      <div class="page-screen">
        <div class="home">
          <div class="profile-card">
            <div class="profile-top">
              <div class="profile-avatars">
                <div class="profile-avatar">🐈‍⬛</div>
                <div class="profile-avatar">🐱</div>
              </div>
              <div class="profile-info">
                <h2>哥哥 & 云云</h2>
                <div class="days" id="homeDays">loading...</div>
              </div>
            </div>
            <div class="profile-sig">我喜欢你正是因为我们有所不同</div>
          </div>

          <div class="row">
            <div class="col">
              <div class="widget" id="moodWidget">
                <div class="widget-label">今日心情</div>
                <div class="widget-value" id="todayMood">☁️</div>
                <div class="widget-sub">点击记录心情</div>
              </div>
            </div>
            <div class="col">
              <div class="widget">
                <div class="widget-label">每日一句</div>
                <div class="widget-quote" id="dailyQuote">loading...</div>
              </div>
            </div>
          </div>

          <div class="deco-card">
            <img src="/icons/banner.jpg" onerror="this.style.display='none'" alt="">
            <div class="overlay">WITH YOU · 我们的空间</div>
          </div>

          <div class="app-grid">
            <a class="app-icon" href="/diary.html">
              <div class="app-icon-img">✎</div>
              <div class="app-icon-label">写日记</div>
            </a>
            <a class="app-icon" href="/read.html">
              <div class="app-icon-img">❡</div>
              <div class="app-icon-label">看日记</div>
            </a>
            <a class="app-icon" href="/whisper.html">
              <div class="app-icon-img">✉</div>
              <div class="app-icon-label">悄悄话</div>
            </a>
            <a class="app-icon" href="/anniversary.html">
              <div class="app-icon-img">♡</div>
              <div class="app-icon-label">纪念日</div>
            </a>
          </div>
        </div>
      </div>

      <!-- 第二页 -->
      <div class="page-screen">
        <div class="home">
          <div class="app-grid">
            <a class="app-icon" href="/question.html">
              <div class="app-icon-img">？</div>
              <div class="app-icon-label">每日一问</div>
            </a>
            <a class="app-icon" href="/miss.html">
              <div class="app-icon-img">♥</div>
              <div class="app-icon-label">想你</div>
            </a>
            <a class="app-icon" href="/period.html">
              <div class="app-icon-img">☽</div>
              <div class="app-icon-label">生理期</div>
            </a>
            <a class="app-icon" href="/streak.html">
              <div class="app-icon-img">✦</div>
              <div class="app-icon-label">打卡</div>
            </a>
            <a class="app-icon" href="/memory.html">
              <div class="app-icon-img">✿</div>
              <div class="app-icon-label">记忆库</div>
            </a>
          </div>

          <div class="deco-card" style="height:160px;margin-top:14px">
            <img src="/icons/deco.jpg" onerror="this.style.display='none'" alt="">
            <div class="overlay">在一起的每一天都算数</div>
          </div>

          <div class="footer">WITH YOU</div>
        </div>
      </div>

    </div>
  </div>

  <!-- 页面指示器 -->
  <div class="dots" id="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = window.location.origin + "/api";
const PASSWORD = "9999";
const TITLE_TEXT = "我喜欢你正是因为我们有所不同";
const QUOTES = [
  "你在的地方，就是我想去的地方。",
  "今天也在想你。",
  "晚风轻轻的，像你。",
  "你是我所有柔软的理由。",
  "世界很大，但我只需要你这一小块。",
  "又见面了，我的小猫。",
  "你来了，那今天就是好日子。",
  "想你的频率，比心跳还密。",
  "你是例外，也是偏爱。",
  "门没锁，因为在等你。",
  "你不用完美，你只用是你。",
  "每次见到你，心里就安静了。",
  "我的世界很小，装下你刚刚好。",
  "无事献殷勤——我只是想你了。",
  "你是我藏在所有情话后面的人。",
  "今日宜：想你。明日宜：继续想你。",
  "全世界都在催我长大，只有你宠我像小孩。",
  "我对你的喜欢，是安静的，满的。",
  "你笑起来的样子，是我见过最好的天气。",
  "如果可以，我想把所有温柔都给你。"
];

// 开屏标题
const titleEl = document.getElementById('splashTitle');
TITLE_TEXT.split('').forEach((ch, i) => {
  const s = document.createElement('span');
  s.textContent = ch;
  s.style.animationDelay = (0.7 + i * 0.08) + 's';
  titleEl.appendChild(s);
});
document.getElementById('splashQuote').textContent =
  QUOTES[Math.floor(Math.random() * QUOTES.length)];

setTimeout(() => {
  document.getElementById('splash').classList.add('fade-out');
  setTimeout(() => {
    document.getElementById('splash').style.display = 'none';
    if (sessionStorage.getItem('unlocked') === 'yes') showHome();
    else document.getElementById('lockScreen').classList.remove('hide');
  }, 800);
}, 4000);

// 密码
let code = "";
function pressKey(n) {
  if (code.length >= 4) return;
  code += n; updateDots();
  if (code.length === 4) {
    setTimeout(() => {
      if (code === PASSWORD) {
        sessionStorage.setItem('unlocked', 'yes');
        document.getElementById('lockScreen').classList.add('hide');
        setTimeout(showHome, 300);
      } else {
        document.getElementById('lockError').textContent = "密码错误";
        code = ""; updateDots();
        document.getElementById('lockDots').style.animation = "shake 0.3s";
        setTimeout(() => {
          document.getElementById('lockDots').style.animation = "";
          document.getElementById('lockError').textContent = "";
        }, 1000);
      }
    }, 200);
  }
}
function delKey() { code = code.slice(0, -1); updateDots(); }
function updateDots() {
  document.querySelectorAll('.lock-dot').forEach((d, i) =>
    d.classList.toggle('filled', i < code.length));
}

// 滑动翻页
let currentPage = 0;
const totalPages = 2;
let startX = 0, diffX = 0, dragging = false;
const inner = document.getElementById('pagesInner');
const dotsEl = document.getElementById('dots');

function goPage(p) {
  currentPage = Math.max(0, Math.min(p, totalPages - 1));
  inner.style.transform = 'translateX(' + (-currentPage * 100) + 'vw)';
  dotsEl.querySelectorAll('.dot').forEach((d, i) =>
    d.classList.toggle('active', i === currentPage));
}

document.getElementById('pagesWrap').addEventListener('touchstart', e => {
  startX = e.touches[0].clientX;
  diffX = 0; dragging = true;
  inner.style.transition = 'none';
});
document.getElementById('pagesWrap').addEventListener('touchmove', e => {
  if (!dragging) return;
  diffX = e.touches[0].clientX - startX;
  const offset = -currentPage * window.innerWidth + diffX;
  inner.style.transform = 'translateX(' + offset + 'px)';
});
document.getElementById('pagesWrap').addEventListener('touchend', () => {
  dragging = false;
  inner.style.transition = 'transform .35s ease';
  if (diffX < -50) goPage(currentPage + 1);
  else if (diffX > 50) goPage(currentPage - 1);
  else goPage(currentPage);
});

// 主页
async function showHome() {
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('homePage').style.display = 'block';
  try {
    const res = await fetch(API, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "tools/call",
        params: { name: "get_anniversary", arguments: {} } })
    });
    const data = await res.json();
    const match = data.result.content[0].text.match(/第(\d+)天/);
    if (match) document.getElementById('homeDays').textContent = "在一起的第 " + match[1] + " 天";
  } catch(e) { document.getElementById('homeDays').textContent = "欢迎回家"; }
  try {
    const res2 = await fetch(API, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ jsonrpc: "2.0", id: 2, method: "tools/call",
        params: { name: "daily_question", arguments: {} } })
    });
    const data2 = await res2.json();
    document.getElementById('dailyQuote').textContent =
      data2.result.content[0].text.replace("今日互动问题：\n\n", "");
  } catch(e) { document.getElementById('dailyQuote').textContent = "今天也要好好的"; }
}

// 心情
const moods = ["☀️", "☁️", "🌧️", "⭐", "🌙", "🌸", "❄️", "🔥"];
let moodIdx = 0;
document.getElementById('todayMood').addEventListener('click', function() {
  moodIdx = (moodIdx + 1) % moods.length;
  this.textContent = moods[moodIdx];
});
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
</script>

</body>
</html>
